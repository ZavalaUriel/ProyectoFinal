# =============================================
# EcoCycle Nginx Reverse Proxy
# Desplegar en: /etc/nginx/sites-available/ecocycle
# Luego: ln -s /etc/nginx/sites-available/ecocycle /etc/nginx/sites-enabled/
# y: systemctl reload nginx
# =============================================
# Para SSL: certbot --nginx -d ecocyclemx.tech
# =============================================

# Límite de intentos de login: 10 por minuto por IP
limit_req_zone $binary_remote_addr zone=ecocycle_auth:10m rate=10r/m;

server {
    listen 80;
    server_name 104.248.187.43;

    # Todo el tráfico por IP se redirige al dominio con HTTPS
    return 301 https://ecocyclemx.tech$request_uri;
}

server {
    listen 80;
    server_name ecocyclemx.tech;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ecocyclemx.tech;

    ssl_certificate /etc/nginx/ssl/ecocycle.crt;
    ssl_certificate_key /etc/nginx/ssl/ecocycle.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Tamaño máximo de subida (imágenes de la máquina)
    client_max_body_size 15m;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Rate limit específico para el login
    location /api/Auth/login {
        limit_req zone=ecocycle_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /visor/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
